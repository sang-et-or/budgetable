# Publication sur Render (site statique, offre gratuite).
# Render lit ce fichier quand on crée un « Blueprint » à partir du dépôt GitHub.
services:
  - type: web
    name: budgetable
    runtime: static
    buildCommand: node build.js && node scripts/photos-locales.js && node scripts/polices-locales.js
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(), payment=()
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /js/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /photos/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # Lecteur de recettes : lit la fiche recette (schema.org) d'un lien collé dans « Ajouter une recette ».
  - type: web
    name: budgetable-recettes
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: node --version
    startCommand: node api/server.js
    healthCheckPath: /sante
    envVars:
      - key: ORIGINES
        value: https://budgetable.fr,https://www.budgetable.fr,https://budgetable.onrender.com
      # assistant IA du site (commis, goûts, photo du placard) : UNE clé, à saisir dans Render.
      # Mistral AI (français, serveurs en Europe) de préférence, ou Anthropic.
      - key: MISTRAL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
