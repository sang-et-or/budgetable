# Publication sur Render (site statique, offre gratuite).
# Render lit ce fichier quand on crée un « Blueprint » à partir du dépôt GitHub.
services:
  - type: web
    name: budgetable
    runtime: static
    buildCommand: node build.js && node scripts/photos-locales.js && node scripts/polices-locales.js
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /js/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /photos/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
