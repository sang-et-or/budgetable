<title>Budgétable</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2f6b47">
<meta name="description" content="Vos déjeuners et dîners de la semaine selon vos goûts, vos besoins et votre budget, avec la liste de courses.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : un carnet de courses. Une colonne de lecture sur mobile,
   navigation en bas ; sur grand écran, navigation latérale et grille de jours. */
:root {
  --papier: #f6f4ec;
  --surface: #ffffff;
  --encre: #1d2721;
  --encre-douce: #5b685f;
  --trait: #dde3d8;
  --poireau: #2f6b47;
  --poireau-pale: #e3eee5;
  --moutarde: #b98410;
  --moutarde-pale: #fbf1d6;
  --tomate: #b0412d;
  --tomate-pale: #f8e4df;
  --ombre: 0 1px 2px rgb(29 39 33 / .06), 0 4px 16px rgb(29 39 33 / .06);
  --f-titre: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-texte: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-craie: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --ardoise: #25332b;
  --bois: #a8743f;
  --r: 14px;
  --mur: #eef1ea; --joint: #dfe5db; --frigo: #fbfcfb; --frigo-bord: #cdd6d0; --frigo-int: #eaf3f6; --congel-int: #e3edf7;
  --bois-int: #efe3d0; --bois-fonce: #8a5c2f; --verre: rgb(255 255 255 / .75); --osier: #c99a5b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #111713; --surface: #18201b; --encre: #e7ede6; --encre-douce: #9eaba2;
    --trait: #2a352e; --poireau: #74c495; --poireau-pale: #1f3326; --moutarde: #e3b44a; --moutarde-pale: #3a2f14;
    --tomate: #ec8b77; --tomate-pale: #3c211b; --mur: #18211c; --joint: #222d26; --frigo: #2b3530; --frigo-bord: #3b4842; --frigo-int: #1b262b; --congel-int: #1a2230;
    --bois-int: #2a231b; --bois-fonce: #6e4a26; --verre: rgb(255 255 255 / .08); --osier: #9c7444;  --ombre: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #111713; --surface: #18201b; --encre: #e7ede6; --encre-douce: #9eaba2;
  --trait: #2a352e; --poireau: #74c495; --poireau-pale: #1f3326; --moutarde: #e3b44a; --moutarde-pale: #3a2f14;
  --tomate: #ec8b77; --tomate-pale: #3c211b; --mur: #18211c; --joint: #222d26; --frigo: #2b3530; --frigo-bord: #3b4842; --frigo-int: #1b262b; --congel-int: #1a2230;
    --bois-int: #2a231b; --bois-fonce: #6e4a26; --verre: rgb(255 255 255 / .08); --osier: #9c7444;  --ombre: 0 1px 2px rgb(0 0 0 / .4); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--papier); }
body { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22220%22%20height%3D%22220%22%20fill%3D%22none%22%20stroke%3D%22%232f6b47%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20opacity%3D%22.09%22%3E%3Cpath%20d%3D%22M30%2020v34M24%2020v10a6%206%200%200%200%2012%200V20%22/%3E%3Ccircle%20cx%3D%22150%22%20cy%3D%2240%22%20r%3D%2213%22/%3E%3Cpath%20d%3D%22M146%2036a6%206%200%201%200%200%208M142%2039h8M142%2042h8%22/%3E%3Cpath%20d%3D%22M60%20120l26-14c4%206%202%2012-6%2016l-20%206z%22/%3E%3Cpath%20d%3D%22M86%20106l8-8M88%20108l10-4%22/%3E%3Cpath%20d%3D%22M170%20150c0-14%2022-14%2022%200v6h-22z%22/%3E%3Cpath%20d%3D%22M166%20156h30%22/%3E%3Cpath%20d%3D%22M40%20180c8-10%2020-10%2028%200%22/%3E%3Ccircle%20cx%3D%2254%22%20cy%3D%22172%22%20r%3D%222%22/%3E%3Cpath%20d%3D%22M120%20190l6-14%206%2014%22/%3E%3Ccircle%20cx%3D%22126%22%20cy%3D%22196%22%20r%3D%225%22/%3E%3Cpath%20d%3D%22M190%2090c-6%200-10-4-10-10%206%200%2010%204%2010%2010zM190%2090v10%22/%3E%3C/svg%3E"); background-size: 220px 220px; }
body { color: var(--encre); font: 16px/1.5 var(--f-texte); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-titre); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 800; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--poireau); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--encre-douce); }
.small { font-size: .875rem; }
.eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--encre-douce); }

.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 110px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* boutons */
.btn { border: 1px solid var(--trait); background: var(--surface); border-radius: 999px; padding: 10px 18px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; }
.btn:hover { border-color: var(--encre-douce); }
a.btn { text-decoration: none; color: var(--poireau); }
.btn-plein { background: var(--poireau); border-color: var(--poireau); color: var(--papier); }
.btn-plein:hover { filter: brightness(1.08); border-color: var(--poireau); }
.lien-externe { color: var(--poireau); font-weight: 600; text-underline-offset: 3px; }
.pied { display: flex; flex-wrap: wrap; gap: 6px 18px; padding-top: 14px; border-top: 1px solid var(--trait); }
.pied a { color: var(--encre-douce); text-underline-offset: 3px; }
.btn-lien { border: 0; background: none; padding: 6px 4px; color: var(--poireau); font-weight: 600; min-height: 0; text-decoration: underline; text-underline-offset: 3px; }
.btn-petit { padding: 6px 12px; min-height: 36px; font-size: .9rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* étiquettes de fiabilité */
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.tag-demo { color: var(--moutarde); background: var(--moutarde-pale); background-image: repeating-linear-gradient(-45deg, transparent 0 6px, rgb(185 132 16 / .12) 6px 9px); border: 1px dashed var(--moutarde); }
.tag-ok { color: var(--poireau); background: var(--poireau-pale); }
.tag-non { color: var(--tomate); background: var(--tomate-pale); }
.tag-simu { color: var(--encre-douce); background: var(--trait); }

.carte { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r); padding: 18px; }
.bandeau { border-radius: var(--r); padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
.bandeau-demo { background: var(--moutarde-pale); border: 1px dashed var(--moutarde); }
.bandeau-alerte { background: var(--tomate-pale); border: 1px solid var(--tomate); }
.bandeau-ok { background: var(--poireau-pale); border: 1px solid var(--poireau); }
.bandeau-info { background: var(--poireau-pale); }

/* ---------- questionnaire ---------- */
.q-shell { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.marque { display: flex; align-items: center; gap: 10px; font-family: var(--f-titre); font-weight: 800; font-size: 1.15rem; }
.marque svg { width: 30px; height: 30px; flex: none; }
.progress { height: 6px; background: var(--trait); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--poireau); border-radius: 99px; transition: width .3s; }
.bulle { background: var(--poireau-pale); color: var(--encre); padding: 10px 14px; border-radius: 4px 14px 14px 14px; align-self: flex-start; max-width: 90%; font-size: .95rem; }
.q-aide { color: var(--encre-douce); }
.choix { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { border: 1.5px solid var(--trait); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 500; min-height: 44px; text-align: left; }
.chip[aria-pressed="true"] { border-color: var(--poireau); background: var(--poireau-pale); font-weight: 600; }
.chip[aria-pressed="true"]::before { content: "✓ "; color: var(--poireau); }
.compteur { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--trait); }
.compteur .ctl { display: flex; align-items: center; gap: 14px; }
.compteur button { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--trait); background: var(--surface); font-size: 1.3rem; line-height: 1; }
.compteur output { min-width: 2ch; text-align: center; font: 700 1.3rem var(--f-titre); }
.q-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 8px; }
.range { width: 100%; accent-color: var(--poireau); }
.gros-chiffre { font: 800 2.6rem var(--f-titre); color: var(--poireau); }
.sous-bloc { border-left: 3px solid var(--poireau-pale); padding-left: 14px; display: flex; flex-direction: column; gap: 12px; }
label.case { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
label.case input { width: 22px; height: 22px; accent-color: var(--poireau); flex: none; margin-top: 2px; }

/* ---------- profil ---------- */
.profil-grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.profil-item { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border: 1px solid var(--trait); border-radius: 12px; background: var(--surface); min-width: 0; }
.profil-item .spread { flex-wrap: nowrap; }

/* ---------- application ---------- */
.entete { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--trait); display: grid; grid-template-columns: repeat(7, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: .72rem; font-weight: 600; color: var(--encre-douce); border-radius: 10px; min-height: 52px; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--poireau); background: var(--poireau-pale); }
/* colonne de gauche : navigation et bandeau du bilan (ordinateur) ; sur téléphone, la navigation reste en bas */
.cote { display: contents; }
.bandeau-nutri { display: none; }
@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: 240px 1fr; gap: 28px; }
  .cote { display: flex; flex-direction: column; gap: 18px; position: sticky; top: calc(20px + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - 40px); overflow-y: auto; scrollbar-width: thin; }
  .nav { position: static; display: flex; flex-direction: column; gap: 4px; border: 0; background: none; padding: 0; }
  .bandeau-nutri { display: grid; gap: 10px; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--trait); box-shadow: var(--ombre); }
  .nutri-mobile { display: none; }
  .nav button { flex-direction: row; justify-content: flex-start; gap: 10px; font-size: .95rem; padding: 10px 14px; min-height: 0; }
  .wrap { padding-bottom: 40px; }
}

/* budget */
.budget { display: grid; gap: 10px; }
.jauge { position: relative; height: 12px; border-radius: 99px; background: var(--trait); overflow: visible; }
.jauge > i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--poireau); }
.jauge.depasse > i { background: var(--tomate); }
.jauge > b { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--encre); }
.chiffres { display: flex; gap: 20px; flex-wrap: wrap; align-items: baseline; }
.chiffres strong { font: 800 1.7rem var(--f-titre); }

/* semaine */
.jours { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.jour { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; }
.jour.aujourdhui { border-color: var(--poireau); box-shadow: 0 0 0 1px var(--poireau); }
.jour > header { padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--trait); background: var(--teinte, var(--poireau-pale)); }
.jour > header h3 { font: 700 1.45rem/1 var(--f-craie); letter-spacing: .01em; }
.jour[data-j="0"] { --teinte: #e3eee5; } .jour[data-j="1"] { --teinte: #fbf1d6; } .jour[data-j="2"] { --teinte: #f8e4df; }
.jour[data-j="3"] { --teinte: #e4ecf4; } .jour[data-j="4"] { --teinte: #efe7f5; } .jour[data-j="5"] { --teinte: #fde9d3; } .jour[data-j="6"] { --teinte: #e6f2dc; }
.jour > header h3 { font-size: 1rem; }
.repas { padding: 12px 16px; display: grid; gap: 6px; }
.repas + .repas { border-top: 1px dashed var(--trait); }
.repas .titre-repas { font-weight: 600; text-align: left; background: none; border: 0; padding: 0; line-height: 1.3; }
.repas .titre-repas:hover { color: var(--poireau); text-decoration: underline; text-underline-offset: 3px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .82rem; color: var(--encre-douce); }
.vide { color: var(--encre-douce); font-style: italic; font-size: .9rem; }

/* fiche recette */
.voile { position: fixed; inset: 0; background: rgb(10 15 12 / .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.fiche { background: var(--surface); width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 700px) { .voile { align-items: center; } .fiche { border-radius: 20px; max-height: 88%; } }
.fiche ul, .fiche ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.etoiles { display: flex; gap: 4px; }
.etoiles button { border: 0; background: none; font-size: 1.7rem; line-height: 1; padding: 2px; color: var(--trait); }
.etoiles button.on { color: var(--moutarde); }
.equi { display: flex; gap: 6px; flex-wrap: wrap; }

/* courses */
.rayon h3 { padding-bottom: 6px; border-bottom: 2px solid var(--encre); margin-bottom: 4px; display: flex; justify-content: space-between; }
.article { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--trait); }
.article input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--poireau); }
.article.coche .nom { text-decoration: line-through; color: var(--encre-douce); }
.article.stock { opacity: .55; }
.article .detail { grid-column: 2 / 4; display: flex; gap: 8px 14px; flex-wrap: wrap; font-size: .82rem; color: var(--encre-douce); }
.article .prix { font-weight: 600; text-align: right; }
.colonnes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 24px; align-items: start; }
textarea { width: 100%; min-height: 160px; border: 1px solid var(--trait); border-radius: 10px; padding: 10px; background: var(--papier); font-family: ui-monospace, monospace; font-size: .8rem; }
input[type=text], input[type=number], select { border: 1px solid var(--trait); border-radius: 10px; padding: 10px 12px; background: var(--surface); min-height: 44px; width: 100%; }
.champ { display: grid; gap: 6px; }
.champ > span { font-weight: 600; font-size: .9rem; }
.form-grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; }

/* ce soir */
.ce-soir { text-align: center; padding: 36px 20px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.ce-soir h1 { font: 700 clamp(2rem, 6vw, 3.2rem)/1.05 var(--f-craie); max-width: 18ch; color: #fbfaf3; }
.ce-soir .btn { background: #fbfaf3; color: var(--ardoise); border-color: #fbfaf3; font-size: 1.05rem; padding: 14px 26px; }
.reponse { font: 700 clamp(1.8rem, 5vw, 2.6rem)/1.1 var(--f-craie); max-width: 22ch; color: #fbfaf3; }
.cloche { width: 120px; height: auto; }

/* offres */
.offres { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.offre { border: 1.5px solid var(--trait); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.offre.active { border-color: var(--poireau); }
.offre ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; font-size: .92rem; }
.prix-offre { font: 800 1.6rem var(--f-titre); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--encre); color: var(--papier); padding: 10px 18px; border-radius: 99px; z-index: 50; font-weight: 600; font-size: .92rem; max-width: calc(100% - 32px); }
@media (min-width: 900px) { .toast { bottom: 24px; } }

/* ---------- décor convivial : nappe, tirelire, ticket de caisse ---------- */
.nappe { height: 14px; border-radius: 8px; margin-bottom: 14px;
  background-color: var(--surface);
  background-image: linear-gradient(90deg, rgb(47 107 71 / .28) 50%, transparent 50%), linear-gradient(rgb(47 107 71 / .28) 50%, transparent 50%);
  background-size: 14px 14px; }
.accueil-hero { display: grid; grid-template-columns: 1fr; gap: 24px; align-items: center; }
@media (min-width: 760px) { .accueil-hero { grid-template-columns: 1.1fr .9fr; } }
.accueil-hero svg { width: 100%; max-width: 420px; height: auto; justify-self: center; }
.promesses { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.promesse { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--trait); }
.pastille { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 800 1.1rem var(--f-titre); }
.pastille.verte { background: var(--poireau-pale); color: var(--poireau); }
.pastille.or { background: var(--moutarde-pale); color: var(--moutarde); }
.pastille.rouge { background: var(--tomate-pale); color: var(--tomate); }
.tirelire-bloc { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; }
.tirelire-bloc svg { width: 96px; height: auto; }
.message-eco { font: 700 1.2rem/1.25 var(--f-titre); }
.message-eco b { color: var(--poireau); }
.message-eco.manque b { color: var(--tomate); }
.part { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; color: #3a2a06; background: #f6d36b; padding: 2px 10px 2px 14px; position: relative;
  clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 50%); border-radius: 0 4px 4px 0; }
.part::after { content: ""; position: absolute; left: 6px; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: var(--surface); }
.part::before { content: none; }
.moyenne { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--r); background: var(--poireau-pale); }
.moyenne strong { font: 800 1.35rem var(--f-titre); color: var(--poireau); }
.ticket { background: var(--surface); padding: 22px 20px 30px; position: relative; box-shadow: var(--ombre);
  --dent: 10px; -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / calc(2 * var(--dent)) 100%;
  mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / calc(2 * var(--dent)) 100%; }
.ticket-tete { text-align: center; display: grid; gap: 2px; padding-bottom: 12px; border-bottom: 2px dashed var(--trait); margin-bottom: 8px; }
.ticket-tete strong { font: 800 1.2rem var(--f-titre); letter-spacing: .04em; text-transform: uppercase; }
.ticket-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px dashed var(--encre-douce); margin-top: 14px; padding-top: 12px; font: 800 1.35rem var(--f-titre); }
.ticket .prix, .ticket-total span:last-child { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

/* ---------- illustrations, test de goût, assistant ---------- */
.illu { display: block; max-width: 100%; height: auto; }
.repas-illu { grid-template-columns: 64px 1fr; align-items: start; column-gap: 12px; }
.repas-corps { display: grid; gap: 6px; min-width: 0; }
.vignette { width: 64px; height: 64px; border-radius: 50%; background: var(--moutarde-pale); display: grid; place-items: center; overflow: hidden; }
.fiche-illu { margin: 0; display: grid; justify-items: center; gap: 4px; padding: 12px; border-radius: var(--r); background: var(--moutarde-pale);
  background-image: linear-gradient(90deg, rgb(47 107 71 / .1) 50%, transparent 50%), linear-gradient(rgb(47 107 71 / .1) 50%, transparent 50%); background-size: 22px 22px; }
.carte-test { background: var(--surface); border: 1px solid var(--trait); border-radius: 22px; padding: 22px 18px; display: grid; gap: 14px; justify-items: center; box-shadow: var(--ombre); }
.carte-test-illu { border-radius: 50%; padding: 10px;
  background-color: var(--moutarde-pale); background-image: linear-gradient(90deg, rgb(47 107 71 / .12) 50%, transparent 50%), linear-gradient(rgb(47 107 71 / .12) 50%, transparent 50%); background-size: 20px 20px; }
.reponses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.reponses .btn { justify-content: center; padding-inline: 8px; }
.rep-non { color: var(--tomate); border-color: var(--tomate); }
.chat { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; padding: 4px; }
.bulle-chat { white-space: pre-line;  background: var(--poireau-pale); padding: 10px 14px; border-radius: 4px 14px 14px 14px; align-self: flex-start; max-width: 88%; }
.bulle-chat.moi { background: var(--moutarde-pale); border-radius: 14px 4px 14px 14px; align-self: flex-end; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- décor : store d'épicerie, ardoise, pastilles ---------- */
.store { height: 46px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 18px; position: relative;
  background: repeating-linear-gradient(90deg, var(--poireau) 0 34px, #fbfaf3 34px 68px);
  -webkit-mask: radial-gradient(17px at 17px 100%, #0000 98%, #000) 0 0 / 34px 100%; mask: radial-gradient(17px at 17px 100%, #0000 98%, #000) 0 0 / 34px 100%;
  box-shadow: inset 0 6px 0 rgb(0 0 0 / .08); }
@media (min-width: 900px) { .store { margin-inline: 0; border-radius: 10px 10px 0 0; } }
.ardoise { background: var(--ardoise); color: #fbfaf3; border: 10px solid var(--bois); border-radius: 18px; box-shadow: inset 0 0 40px rgb(0 0 0 / .35), var(--ombre);
  background-image: radial-gradient(rgb(255 255 255 / .05) 1px, transparent 1px); background-size: 6px 6px; }
.ardoise-titre { padding: 16px 20px 18px; display: grid; gap: 2px; }
.craie { font: 700 clamp(2rem, 5.5vw, 2.8rem)/1.05 var(--f-craie); color: #fbfaf3; letter-spacing: .01em; }
.craie-petit { font: 600 1.3rem/1.1 var(--f-craie); color: #f6d36b; }
.craie-ligne { font: 600 1.15rem/1.3 var(--f-craie); color: rgb(251 250 243 / .8); }
.stickers { position: relative; justify-self: center; width: 100%; max-width: 440px; }
.sticker { position: absolute; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; text-align: center; padding: 8px;
  font: 700 1.15rem/1 var(--f-craie); box-shadow: 0 3px 0 rgb(0 0 0 / .15); border: 3px dashed rgb(255 255 255 / .7); }
.sticker.s1 { top: -6px; left: 0; background: var(--tomate); color: #fff; transform: rotate(-12deg); }
.sticker.s2 { bottom: 18px; left: 8px; background: #f6d36b; color: #3a2a06; transform: rotate(9deg); }
.sticker.s3 { top: 40%; right: -6px; background: var(--poireau); color: #fff; transform: rotate(-6deg); }
@media (max-width: 480px) { .sticker { width: 74px; height: 74px; font-size: .95rem; } }
.carte h2, .q-shell > h2 { text-decoration: underline wavy #e3b44a 2px; text-underline-offset: 7px; text-decoration-skip-ink: none; }
.piece-qui-tombe { animation: tombe 2.2s ease-in infinite; transform-box: fill-box; transform-origin: center; }
@keyframes tombe { 0% { transform: translateY(-14px); opacity: 0; } 25% { opacity: 1; } 70% { transform: translateY(10px); opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }
.chips-nav { font-family: var(--f-craie); }

/* photos d'illustration (le dessin reste dessous si la photo ne charge pas) */
.photo { position: relative; display: inline-grid; place-items: center; overflow: hidden; flex: none; max-width: 100%; background: var(--moutarde-pale); }
.photo > svg { width: 100%; height: 100%; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo.rond { border-radius: 50%; }
.photo.rect { border-radius: 14px; display: grid; }
.photo.rect > svg { width: auto; }
.photo.sans-photo img { display: none; }
.fiche-illu { padding: 0; background: none; }
.credits { margin: 10px 0 0; padding-left: 1.1em; display: grid; gap: 4px; font-size: .82rem; }
.credits a { word-break: break-word; }
.fiche figcaption a, .credits a { color: var(--poireau); font-weight: 600; }

/* mes drives */
.liste-magasins { display: grid; gap: 8px; }
.magasin { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--trait); border-radius: 12px; background: var(--surface); cursor: pointer; }
.magasin input { width: 22px; height: 22px; accent-color: var(--poireau); }
.magasin-corps { display: grid; gap: 2px; min-width: 0; }
.magasin a:not(.btn), .carte a:not(.btn) { color: var(--poireau); font-weight: 600; }
@media (max-width: 520px) { .magasin { grid-template-columns: auto 1fr; } .magasin .tag, .magasin .btn, .magasin > .small { grid-column: 2; justify-self: start; } }

/* vue imprimable */
.imprimable .nav, .imprimable .ecran-seul { display: none !important; }
.imprimable .app { display: block; }
.imprimable .article input { display: none; }
@media print {
  .nav, .ecran-seul, .toast, .store { display: none !important; }
  body { background-image: none; }
  body, html { background: #fff; color: #000; }
  .app { display: block; }
  .wrap { padding: 0; }
  .article { break-inside: avoid; }
  .rayon { break-inside: avoid-page; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- choisir ses plats : 3 idées, rituels, classiques, choix des enfants ---------- */
.pourquoi { display: inline-flex; align-items: center; gap: 6px; color: var(--poireau); font-weight: 600; }
.pourquoi::before { content: "✓"; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--poireau-pale); font-size: 11px; }
.eyebrow .theme { color: var(--moutarde); }
.coeur { color: var(--tomate); }
.repas-enfants { display: flex; gap: 12px; align-items: flex-start; background: var(--moutarde-pale); border: 2px dashed var(--moutarde); border-radius: 14px; padding: 10px; }
.repas-enfants .repas-corps { display: flex; flex-direction: column; gap: 4px; }
.idee-rituels { background: var(--moutarde-pale); border-left: 5px solid var(--moutarde); border-radius: 12px; padding: 14px 16px; }
.rituels summary { cursor: pointer; list-style: revert; }
.grille-rituels { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.grille-rituels select { width: 100%; min-height: 40px; border: 1px solid var(--trait); border-radius: 10px; padding: 6px 8px; background: var(--surface); color: var(--encre); font: inherit; }
.tag-classique { text-transform: none; letter-spacing: 0; font-size: .85rem; background: var(--tomate-pale); color: var(--tomate); display: inline-flex; gap: 4px; align-items: center; }
.tag-classique .btn-lien { color: var(--tomate); padding: 0 2px; text-decoration: none; }
.fiche.fenetre-choix { max-width: 1000px; }
.grille-choix { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.choix-carte { border: 1px solid var(--trait); border-radius: 16px; overflow: hidden; background: var(--surface); display: flex; flex-direction: column; }
.choix-carte.actuel { border: 2px solid var(--poireau); }
.choix-carte h3 { margin: 0; font-size: 1.05rem; line-height: 1.3; }
.choix-carte .photo, .choix-carte > svg { border-radius: 0; }
.raisons { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.raisons li { font-size: .88rem; color: var(--poireau); font-weight: 600; padding-left: 22px; position: relative; }
.raisons li::before { content: "✓"; position: absolute; left: 0; top: 0; width: 16px; height: 16px; border-radius: 50%; background: var(--poireau-pale); display: grid; place-items: center; font-size: 10px; }
.grille-choix.enfants .choix-carte { border-width: 3px; border-color: var(--moutarde); }
.grille-choix.enfants h3 { font-size: 1.3rem; text-align: center; }
.grille-choix.enfants .row { justify-content: center; }
.grille-choix.enfants .btn { font-size: 1.15rem; padding: 12px 28px; }

/* ---------- courses guidées sur le drive ---------- */
.btn-grand { min-height: 54px; font-size: 1.05rem; padding: 12px 22px; justify-content: center; text-align: center; }
.fiche.fenetre-courses { max-width: 560px; }
.fenetre-courses .btn-grand { width: 100%; }
.article-courses { background: var(--moutarde-pale); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; }
.article-courses .a-prendre { font-size: 1.15rem; margin: 0; }
.fenetre-courses a.btn-plein, .panier-drive a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.fenetre-courses a.btn-plein { color: #fff; }
.btn-chercher { background: var(--surface); border: 2px solid var(--poireau); color: var(--poireau); font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; }
.prix-paye input { max-width: 160px; }
.liste-absents { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.liste-absents li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--trait); padding: 4px 0; }
.panier-drive details summary { cursor: pointer; color: var(--encre-douce); }

/* ---------- recherche de plats, saisie de recettes, bibliothèque ---------- */
.recherche-plat input[type=search], .fenetre-edition input[type=search] { width: 100%; }
.resultats { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.resultat { width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--trait); border-radius: 12px; padding: 6px 10px; cursor: pointer; font: inherit; color: var(--encre); }
.resultat:hover, .resultat:focus-visible { border-color: var(--poireau); }
.resultat > span:last-child { display: flex; flex-direction: column; }
.resultat .vignette { width: 40px; height: 40px; flex: none; }
.fiche.fenetre-edition { max-width: 640px; }
.fenetre-edition .champ input, .fenetre-edition .champ select { width: 100%; }
.ing-cocher { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2px 14px; }
.ing-cocher .case { align-items: flex-start; padding: 4px 0; }
.lien-chercher { text-decoration: none; color: var(--poireau); font-weight: 600; min-height: 40px; display: inline-flex; align-items: center; }
.propositions { background: var(--moutarde-pale); border-radius: 14px; padding: 12px 14px; }
.puces-ajout { gap: 8px; }
.puce-ajout { min-height: 40px; background: var(--surface); border-color: var(--moutarde); font-weight: 600; }
.puce-ajout:hover, .puce-ajout:focus-visible { border-color: var(--poireau); color: var(--poireau); }
.puce-alerte { border-color: var(--tomate); color: var(--tomate); }
.dans-recette { border: 1px solid var(--trait); border-radius: 14px; padding: 12px 14px; }
.alerte-ing { color: var(--tomate); font-weight: 700; }
.vide-recettes { border-style: dashed; }
.grille-au-menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.jour-au-menu { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border: 1px solid var(--trait); border-radius: 12px; padding: 8px 10px; }
.jour-au-menu strong { flex: 1 0 100%; font-size: .95rem; }
.carte-recette .meta a { color: var(--poireau); font-weight: 600; text-underline-offset: 3px; }
.lien-recette { text-decoration: none; align-self: flex-start; color: #fff; }
@media (max-width: 420px) { .nav button { font-size: .66rem; } }

/* ---------- placard ---------- */
.a-faire { border-left: 5px solid var(--moutarde); }
.liste-stock { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.ligne-stock { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--trait); border-radius: 12px; padding: 10px 12px; }
.jauge { display: block; height: 6px; background: var(--trait); border-radius: 99px; overflow: hidden; max-width: 220px; }
.jauge i { display: block; height: 100%; background: var(--poireau); }
.liste-repas-faits { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.placard-info { color: var(--poireau); font-weight: 600; }
#mes-drives summary { cursor: pointer; }

/* ---------- lecture d'un lien de recette ---------- */
.lecture { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--trait); }
.lecture-ok { border-color: var(--poireau); color: var(--encre, inherit); }
.lecture-echec { border-color: var(--moutarde); }
.rond-attente { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--trait); border-top-color: var(--poireau); border-radius: 50%; animation: tourne .8s linear infinite; vertical-align: -1px; }
@keyframes tourne { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .rond-attente { animation: none; } }

/* ---------- quantités d'une recette perso ---------- */
.ing-qte { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ing-qte .case { flex: 1; min-width: 0; }
.qte-saisie { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.qte-saisie input { width: 72px; text-align: right; padding: 6px 8px; border: 1px solid var(--trait); border-radius: 8px; font: inherit; background: var(--surface); }
.qte-saisie .muted { min-width: 3.2em; }
.personnes-recette strong { min-width: 1.5em; text-align: center; font-size: 1.1rem; }

/* ---------- photo d'une recette perso ---------- */
.bloc-photo { display: flex; gap: 14px; align-items: center; }
.apercu-photo { width: 96px; height: 96px; border-radius: 14px; overflow: hidden; flex-shrink: 0; background: var(--surface); border: 1px dashed var(--trait); display: grid; place-items: center; }
.apercu-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-vide { font-size: 28px; opacity: .6; }
.choisir-photo { position: relative; align-self: flex-start; cursor: pointer; }
.choisir-photo:focus-within { outline: 3px solid var(--moutarde); outline-offset: 2px; }
.visuellement-cache { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- courses faites ---------- */
.courses-faites { border-left: 5px solid var(--poireau); }
.bilan-rangement { border-left: 5px solid var(--poireau); background: var(--surface); }
.ligne-stock.nouveau { border-color: var(--poireau); }
.tag-nouveau { display: inline-block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #fff; background: var(--poireau); border-radius: 99px; padding: 1px 8px; vertical-align: 2px; }

/* ---------- la cuisine du placard ---------- */
.cuisine { position: relative; overflow: clip; border-radius: 18px; padding: 16px 14px 0;
  background-color: var(--mur);
  background-image: linear-gradient(var(--joint) 2px, transparent 2px), linear-gradient(90deg, var(--joint) 2px, transparent 2px);
  background-size: 34px 22px; border: 1px solid var(--trait); display: grid; gap: 14px; }
.cuisine .porte, .cuisine .corbeille { cursor: pointer; font: inherit; color: inherit; }
.cuisine button:focus-visible { outline: 3px solid var(--moutarde); outline-offset: 2px; }
.meuble, .compartiment { position: relative; }
.caisson { position: relative; border-radius: 10px; }
/* placard mural */
.meuble-placard { min-height: 118px; }
.meuble-placard > .caisson { min-height: 118px; background: var(--bois-int); box-shadow: inset 0 6px 14px rgb(0 0 0 / .18); border: 6px solid var(--bois-fonce); }
.portes-doubles { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; pointer-events: none; }
.porte { border: 0; padding: 0; pointer-events: auto; transition: transform .6s cubic-bezier(.3,.7,.2,1), opacity .6s; backface-visibility: visible; }
.portes-doubles .porte { background: var(--bois); border-radius: 8px; box-shadow: inset 0 0 0 7px rgb(0 0 0 / .08), inset 0 0 0 9px rgb(255 255 255 / .12), 0 3px 8px rgb(0 0 0 / .15); position: relative; }
.porte-g { transform-origin: left center; }
.porte-d { transform-origin: right center; }
.porte .poignee { position: absolute; width: 6px; height: 28px; border-radius: 4px; background: #e8e2d6; box-shadow: 0 1px 2px rgb(0 0 0 / .35); top: 50%; translate: 0 -50%; }
.porte-g .poignee { right: 10px; } .porte-d .poignee { left: 10px; }
.meuble-placard.ouvert .porte-g { transform: perspective(1000px) rotateY(-97deg); }
.meuble-placard.ouvert .porte-d { transform: perspective(1000px) rotateY(97deg); }
.etiquette { position: absolute; left: 10px; top: 10px; display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: .82rem; padding: 3px 9px; border-radius: 99px; background: rgb(255 255 255 / .88); color: #1d2721; box-shadow: 0 1px 3px rgb(0 0 0 / .2); text-transform: capitalize; }
.compte { min-width: 1.5em; text-align: center; font-size: .75rem; background: #2f6b47; color: #fff; border-radius: 99px; padding: 0 6px; }
.meuble.ouvert .etiquette, .compartiment.ouvert .etiquette { opacity: 0; }
/* bas : frigo + plan de travail */
.rangee-bas { display: grid; grid-template-columns: 1.1fr 1fr; gap: 12px; align-items: end; }
.ouverte-frigo .rangee-bas, .ouverte-congel .rangee-bas, .ouverte-corbeille .rangee-bas { grid-template-columns: 1fr; }
.meuble-frigo { background: var(--frigo); border: 2px solid var(--frigo-bord); border-radius: 18px 18px 8px 8px; padding: 5px; display: grid; gap: 5px; box-shadow: 0 6px 14px rgb(0 0 0 / .12); }
.compartiment.congel { min-height: 86px; }
.compartiment.frigo { min-height: 210px; }
.compartiment > .caisson { min-height: inherit; height: 100%; }
.compartiment.frigo > .caisson { background: var(--frigo-int); box-shadow: inset 0 0 24px rgb(255 255 255 / .6), inset 0 4px 10px rgb(0 0 0 / .12); }
.compartiment.congel > .caisson { background: var(--congel-int); box-shadow: inset 0 0 18px rgb(190 215 240 / .7), inset 0 4px 10px rgb(0 0 0 / .12); }
.compartiment .porte { position: absolute; inset: 0; border-radius: 12px; background: linear-gradient(105deg, var(--frigo) 0 70%, color-mix(in srgb, var(--frigo) 88%, #9fb3a8)); border: 1px solid var(--frigo-bord); transform-origin: left center; }
.compartiment .porte .poignee { right: 12px; left: auto; width: 7px; height: 46px; background: linear-gradient(#c5cdc8, #9aa59f); }
.compartiment.congel .porte .poignee { top: auto; bottom: 10px; translate: 0; height: 30px; }
.compartiment.ouvert .porte { transform: perspective(1100px) rotateY(-98deg); }
.plan-travail { display: grid; gap: 0; }
.corbeille { position: relative; border: 0; background: none; padding: 34px 0 0; display: grid; justify-items: center; min-height: 120px; }
.dans-corbeille { font-size: 26px; line-height: 1; letter-spacing: -6px; position: relative; z-index: 1; margin-bottom: -10px; max-width: 100%; overflow: hidden; white-space: nowrap; }
.panier { width: 78%; height: 44px; background: repeating-linear-gradient(90deg, var(--osier) 0 6px, color-mix(in srgb, var(--osier) 75%, #000) 6px 8px), var(--osier); clip-path: polygon(0 0, 100% 0, 88% 100%, 12% 100%); border-radius: 4px; }
.corbeille .etiquette { top: 0; left: 0; }
.plan-travail::after { content: ""; display: block; height: 96px; margin-top: 0; border-top: 12px solid var(--bois); border-radius: 4px; background: linear-gradient(var(--frigo) 0 0) 10% 22% / 80% 4px no-repeat, linear-gradient(var(--frigo-bord) 0 0) 10% 70% / 80% 4px no-repeat, color-mix(in srgb, var(--bois-int) 70%, var(--frigo)); box-shadow: 0 6px 14px rgb(0 0 0 / .1); }
.ouverte-corbeille .plan-travail::after { height: 18px; }
.plan-travail > .caisson { background: var(--surface); border: 1px solid var(--trait); margin-top: 8px; }
.sol { height: 14px; margin: 0 -14px; background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--bois) 55%, var(--mur)) 0 40px, color-mix(in srgb, var(--bois) 45%, var(--mur)) 40px 80px); }
/* intérieur */
.interieur { padding: 12px; display: grid; gap: 12px; }
.int-tete { align-items: center; }
.etagere { display: grid; gap: 6px; padding-bottom: 10px; border-bottom: 5px solid var(--verre); box-shadow: 0 6px 6px -6px rgb(0 0 0 / .25); }
.meuble-placard .etagere { border-bottom-color: var(--bois); }
.etagere:last-of-type { border-bottom: 0; box-shadow: none; }
.etagere-nom { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--encre-douce); }
.rangee { display: flex; flex-wrap: wrap; gap: 8px; }
.rangee .vide { color: var(--encre-douce); font-style: italic; }
.produit { position: relative; width: 78px; display: grid; justify-items: center; gap: 2px; padding: 7px 4px 6px; border-radius: 12px; border: 1px solid var(--trait); background: var(--surface); color: var(--encre); font: inherit; cursor: pointer; box-shadow: 0 1px 3px rgb(0 0 0 / .08); }
.produit .emoji { font-size: 26px; line-height: 1.1; }
.produit .p-nom { font-size: .7rem; line-height: 1.15; font-weight: 600; text-align: center; overflow-wrap: anywhere; }
.produit .p-qte { font-size: .7rem; color: var(--encre-douce); }
.produit .jauge { width: 56px; height: 4px; }
.produit.presque-fini .jauge i { background: var(--tomate); }
.produit.sel { outline: 3px solid var(--poireau); outline-offset: 1px; }
.pastille-nouveau { position: absolute; top: 5px; right: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--poireau); box-shadow: 0 0 0 2px var(--surface); }
.produit-detail { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; background: var(--surface); border: 2px solid var(--poireau); }
.produit-detail .emoji { font-size: 30px; }
.liste-detaillee summary { cursor: pointer; padding: 6px 0; }
@media (prefers-reduced-motion: reduce) { .porte { transition: none; } }

/* ---------- cuisine 3D ---------- */
.cuisine-3d { display: grid; gap: 10px; }
.scene3d { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--trait); background: var(--mur); min-height: 300px; display: grid; place-items: center; }
.scene3d canvas { display: block; touch-action: pan-y; cursor: pointer; }
.chargement-3d { display: flex; gap: 8px; align-items: center; }
.aide-3d { margin: -2px 0 0; text-align: center; }
.zones-3d { gap: 6px; justify-content: center; }
.zones-3d .chip { display: inline-flex; gap: 6px; align-items: center; }
.zones-3d .chip[aria-pressed="true"] { background: var(--poireau); color: #fff; border-color: var(--poireau); }
.panneau-3d { border-radius: 16px; border: 1px solid var(--trait); background: var(--frigo-int); }
.panneau-3d .etagere { border-bottom-color: var(--frigo-bord); }

/* ---------- ajouter en photo ---------- */
.photo-stock { border-left: 5px solid var(--moutarde); }
.liste-photo { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.liste-photo li { display: flex; gap: 10px; align-items: center; }
.liste-photo img, .liste-photo .emoji { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; background: var(--surface); flex-shrink: 0; font-size: 28px; display: grid; place-items: center; }

/* ---------- grignotages gourmands ---------- */
.visuel-gourmand { display: grid; place-items: center; line-height: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6e6, #f6dcc0); box-shadow: inset 0 0 0 3px rgb(255 255 255 / .6); }
.visuel-gourmand.dessert { background: radial-gradient(circle at 35% 30%, #fdeef2, #f3cbd6); }
.visuel-gourmand.rect { border-radius: 16px; }
.grille-gourmande { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.carte-gourmande { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--trait); box-shadow: var(--ombre); }
.carte-gourmande.incompatible { opacity: .75; }
.carte-gourmande .titre-repas { border: 0; background: none; padding: 0; text-align: left; font: inherit; font-weight: 700; font-size: 1.02rem; color: var(--encre); cursor: pointer; }
.vignette-g { border: 0; padding: 0; background: none; cursor: pointer; flex-shrink: 0; }
.filtres-g { gap: 6px; }
.filtres-g .chip[aria-pressed="true"], .fenetre-gourmand .chip[aria-pressed="true"] { background: var(--poireau); color: #fff; border-color: var(--poireau); }
.liste-gourmande { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.liste-gourmande li { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.ligne-gourmande { display: block; width: 100%; text-align: left; border: 0; border-top: 1px dashed var(--trait); background: none; padding: 8px 2px 2px; font: inherit; font-size: .9rem; color: var(--encre); cursor: pointer; }
.fenetre-gourmand { display: grid; gap: 16px; }
.nav button span { font-size: .68rem; }

/* ---------- calories et Nutri-Score ---------- */
.nutri-mini { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.ns-lettre { display: inline-grid; place-items: center; width: 1.35em; height: 1.35em; border-radius: 50%; color: #fff; font-weight: 800; font-size: .78rem; line-height: 1; }
.ns-A { background: #038141; } .ns-B { background: #85bb2f; } .ns-C { background: #fecb02; color: #1d2721 !important; } .ns-D { background: #ee8100; } .ns-E { background: #e63e11; }
.bloc-nutri { display: grid; gap: 8px; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--trait); }
.echelle-ns { display: inline-grid; gap: 2px; padding: 4px 6px 6px; border-radius: 10px; background: #fff; border: 1px solid #d4d4d4; }
.ns-titre { font-size: .58rem; font-weight: 800; letter-spacing: .06em; color: #555; text-align: center; }
.ns-lettres { display: flex; align-items: center; }
.ns-lettres span { width: 22px; height: 26px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: .85rem; opacity: .55; }
.ns-lettres span:first-child { border-radius: 8px 0 0 8px; } .ns-lettres span:last-child { border-radius: 0 8px 8px 0; }
.ns-lettres span.actif { opacity: 1; width: 30px; height: 36px; border-radius: 10px; font-size: 1.15rem; box-shadow: 0 0 0 2px #fff, 0 2px 6px rgb(0 0 0 / .3); position: relative; z-index: 1; }
.kcal-gros { font-size: 1.3rem; }

/* ---------- coachs ---------- */
.invite-coach { border-left: 5px solid var(--poireau); }
.coach-actif { border-left: 5px solid var(--poireau); background: linear-gradient(135deg, var(--poireau-pale), var(--surface) 60%); }
.objectifs-coach { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.objectifs-coach li { display: flex; gap: 8px; align-items: baseline; }
.objectifs-coach li.ok > span:first-child { color: var(--poireau); font-weight: 800; }
.objectifs-coach li.a-voir > span:first-child { color: var(--moutarde); font-weight: 800; }
.fenetre-coach { display: grid; gap: 14px; }
.fenetre-coach .chip[aria-pressed="true"] { background: var(--poireau); color: #fff; border-color: var(--poireau); }
.astuces-coach { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.prudence-coach { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--moutarde-pale); }

/* ---------- budget : saisie libre et calculateur ---------- */
.fenetre-budget { display: grid; gap: 18px; }
.fenetre-budget .chip[aria-pressed="true"] { background: var(--poireau); color: #fff; border-color: var(--poireau); }
.grille-calc { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); margin-top: 10px; }
.saisie-euros { display: flex; align-items: center; gap: 6px; }
.saisie-euros input { flex: 1; min-width: 0; text-align: right; }
.chiffres-calc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chiffres-calc > div { display: grid; gap: 2px; }
.chiffres-calc strong { font-size: 1.1rem; }
.chiffres-calc .negatif { color: var(--tomate); }
.resultat-calc { border-left: 5px solid var(--poireau); }
.propositions-budget { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.choix-budget { display: grid; gap: 2px; justify-items: center; padding: 10px 6px; border-radius: 12px; border: 2px solid var(--trait); background: var(--surface); color: var(--encre); font: inherit; cursor: pointer; }
.choix-budget[aria-checked="true"] { border-color: var(--poireau); background: var(--poireau-pale); }
.choix-budget strong { font-size: 1.15rem; }

/* ---------- qui mange cette semaine ---------- */
.grille-presences { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px 8px; align-items: center; }
.cellule-presence { display: flex; gap: 8px; justify-content: center; align-items: center; min-height: 40px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--trait); background: var(--surface); color: var(--encre); font: inherit; font-size: .9rem; cursor: pointer; }
.cellule-presence .dehors { color: var(--encre-douce); font-style: italic; }
.cellule-presence .invites { color: var(--poireau); font-weight: 700; }
.cellule-presence.sel { border-color: var(--poireau); box-shadow: 0 0 0 2px var(--poireau-pale); }
.raccourcis-presences { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.raccourcis-presences .chip { font-size: .85rem; white-space: nowrap; flex-shrink: 0; }
.fenetre-presence .chip[aria-pressed="true"] .muted { color: rgb(255 255 255 / .85); }
.fenetre-presence { display: grid; gap: 14px; }
.fenetre-presence .chip[aria-pressed="true"] { background: var(--poireau); color: #fff; border-color: var(--poireau); }
.ligne-presence { align-items: center; }

/* ---------- bilan nutritionnel ---------- */
.score-reperes { padding: 4px 10px; border-radius: 99px; font-size: .9rem; }
.score-reperes.bon { background: var(--poireau-pale); color: var(--poireau); }
.score-reperes.moyen { background: var(--moutarde-pale); color: var(--moutarde); }
.score-reperes.faible { background: var(--tomate-pale); color: var(--tomate); }
.chiffres-nutri { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chiffres-nutri > div { display: grid; gap: 0; padding: 8px 6px; border-radius: 10px; background: var(--papier); text-align: center; }
.chiffres-nutri strong { font-size: 1rem; }
.chiffres-nutri .rep-bas, .chiffres-nutri .rep-haut { box-shadow: inset 0 0 0 2px var(--moutarde); }
.liste-reperes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.liste-reperes li { display: flex; gap: 10px; align-items: flex-start; }
.liste-reperes li > span:first-child { width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; font-weight: 800; flex-shrink: 0; }
.et-ok { background: var(--poireau-pale); color: var(--poireau); }
.et-bas { background: var(--moutarde-pale); color: var(--moutarde); }
.et-haut { background: var(--tomate-pale); color: var(--tomate); }
.conseil-nutri { color: var(--encre); }
@media (max-width: 380px) { .chiffres-nutri { grid-template-columns: repeat(2, 1fr); } }

.mini-chiffres { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mini-chiffres > div { display: grid; padding: 6px; border-radius: 10px; background: var(--papier); text-align: center; line-height: 1.2; }
.mini-chiffres span { font-size: .7rem; color: var(--encre-douce); }
.mini-chiffres strong { font-size: 1rem; }
.mini-chiffres .rep-bas, .mini-chiffres .rep-haut { box-shadow: inset 0 0 0 2px var(--moutarde); }
.bandeau-nutri .btn { white-space: normal; text-align: center; justify-content: center; }
.mini-reperes { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .85rem; }
.mini-reperes li { display: grid; grid-template-columns: 1.4em 1fr auto; gap: 6px; align-items: center; }
.mini-reperes .fleche { width: 1.4em; height: 1.4em; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
.mini-reperes .rep-bas .fleche { background: var(--moutarde-pale); color: var(--moutarde); }
.mini-reperes .rep-haut .fleche { background: var(--tomate-pale); color: var(--tomate); }
.fenetre-bilan { display: grid; gap: 10px; }
.fenetre-bilan .bilan-nutri { border: 0; box-shadow: none; padding: 0; }

/* ---------- coach nutrition : améliorer la semaine ---------- */
.fenetre-ameliorer { display: grid; gap: 14px; }
.avant-apres { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; background: var(--poireau-pale); }
.avant-apres > div { display: grid; }
.avant-apres strong { font-size: 1.4rem; }
.proposition-coach { display: grid; gap: 8px; padding: 12px; border-radius: 14px; border: 1px solid var(--trait); background: var(--surface); }
.echange { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.plat-echange { display: grid; justify-items: center; text-align: center; gap: 4px; }
.plat-echange.avant { opacity: .65; }
.plat-echange.avant .small { text-decoration: line-through; }
.fleche-echange { font-size: 1.4rem; color: var(--poireau); font-weight: 800; }
.plat-echange .titre-repas { border: 0; background: none; padding: 0; font-weight: 700; color: var(--encre); cursor: pointer; }

/* ---------- c'est mangé et avis rapide ---------- */
.btn-mange { border-color: var(--poireau); color: var(--poireau); }
.mange-ok { padding: 8px 10px; border-radius: 12px; background: var(--poireau-pale); }
.avis-rapide { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.avis-rapide button { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 99px; border: 1px solid var(--trait); background: var(--surface); color: var(--encre); font: inherit; cursor: pointer; }
.avis-rapide button span:first-child { font-size: 1.1rem; }
.avis-rapide button.on { border-color: var(--poireau); background: var(--poireau); color: #fff; }

/* ---------- mes apports ---------- */
@media (max-width: 899px) { .nav button[data-k="apports"], .nav button[data-k="journal"], .nav button[data-k="promos"] { display: none; } }
.tuiles-apports { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tuile-apport { display: grid; gap: 2px; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--trait); }
.tuile-apport strong { font: 800 1.5rem var(--f-titre); }
.tuile-apport.rep-bas, .tuile-apport.rep-haut { border-color: var(--moutarde); }
.etat-ok { color: var(--poireau); font-weight: 600; } .etat-bas { color: var(--moutarde); font-weight: 600; } .etat-haut { color: var(--tomate); font-weight: 600; }
.grille-graphes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
.graphe { margin: 0; }
.graphe svg { width: 100%; height: auto; display: block; overflow: visible; }
.graphe .grille { stroke: var(--trait); stroke-width: 1; }
.graphe .axe { font: 500 9px var(--f-texte); fill: var(--encre-douce); }
.graphe .objectif { stroke: var(--encre); stroke-width: 1.5; stroke-dasharray: 4 3; }
.graphe .objectif-txt { fill: var(--encre); font-weight: 700; }
.graphe .plein { fill: var(--poireau); }
.graphe .zone { fill: transparent; }
.graphe .barre:hover .plein { opacity: .8; }
.graphe .barre:hover .zone { fill: var(--poireau-pale); opacity: .5; }
.legende-graphe { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.trait-objectif { width: 18px; border-top: 2px dashed var(--encre); }
#bulle-graphe { position: fixed; z-index: 60; pointer-events: none; padding: 6px 10px; border-radius: 8px; background: var(--encre); color: var(--papier); font-size: .8rem; max-width: 260px; box-shadow: var(--ombre); }
.hbarres { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.hbarres li { display: grid; grid-template-columns: minmax(90px, 40%) 1fr auto; gap: 8px; align-items: center; }
.hbarres .piste { height: 12px; border-radius: 99px; background: var(--trait); overflow: hidden; }
.hbarres .piste i { display: block; height: 100%; border-radius: 99px; background: var(--poireau); }
.liste-confirmer { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.liste-confirmer li { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.journal { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: .85rem; }
.journal th, .journal td { padding: 6px 4px; border-bottom: 1px solid var(--trait); text-align: left; }
.journal .num { text-align: right; }

/* ---------- carnet du jour ---------- */
.carnet { border-top: 5px solid var(--poireau); }
.humeur-jour { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--papier); }
.gros-smiley { font-size: 2.6rem; line-height: 1; }
.compteurs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.compteur { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--trait); background: var(--surface); }
.compteur .smiley { font-size: 1.6rem; line-height: 1; }
.compteur > .stack { flex: 1; }
.compteur.c-rouge { border-color: var(--tomate); background: var(--tomate-pale); }
.compteur.c-neutre { border-color: var(--moutarde); }
.piste-c { display: block; height: 8px; border-radius: 99px; background: var(--trait); overflow: hidden; }
.piste-c i { display: block; height: 100%; border-radius: 99px; background: var(--poireau); }
.c-neutre .piste-c i { background: var(--moutarde); }
.c-rouge .piste-c i { background: var(--tomate); }
.liste-carnet { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.liste-carnet li { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--trait); }
.ajout-carnet .chip[aria-pressed="true"], .carnet .chip[aria-pressed="true"] { background: var(--poireau); color: #fff; border-color: var(--poireau); }
.ajout-carnet .chip[aria-pressed="true"] .muted { color: rgb(255 255 255 / .8); }

.produit-scanne { display: grid; gap: 10px; padding: 12px; border-radius: 14px; border: 2px solid var(--poireau); background: var(--surface); }
.produit-scanne img, .emoji-scan { width: 56px; height: 56px; object-fit: contain; border-radius: 10px; background: #fff; flex-shrink: 0; font-size: 34px; display: grid; place-items: center; }
.produit-scanne .chip[aria-pressed="true"] { background: var(--poireau); color: #fff; border-color: var(--poireau); }

.fenetre-kcal { display: grid; gap: 14px; }
.fenetre-kcal .chip[aria-pressed="true"] { background: var(--poireau); color: #fff; border-color: var(--poireau); }
.fenetre-kcal .chip[aria-pressed="true"] .muted { color: rgb(255 255 255 / .8); }
.fenetre-kcal .stack[role="radiogroup"] .chip { justify-content: flex-start; text-align: left; }
.resultat-kcal { padding: 12px; border-radius: 14px; border-left: 5px solid var(--poireau); background: var(--poireau-pale); }
.repere-final { color: var(--poireau); }

/* ---------- mon journal ---------- */
.resume-journal { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.resume-journal > div { display: grid; gap: 2px; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--trait); }
.resume-journal strong { font: 800 1.3rem var(--f-titre); }
.jour-journal { display: grid; gap: 10px; }
.jour-journal h2 { font-size: 1.1rem; margin: 0; }
.smiley-jour { font-size: 1.8rem; line-height: 1; }
.groupe-journal ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px; }
.groupe-journal li { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--trait); }
#journal-jours .chip[aria-pressed="true"], .chip[data-a^="journal"][aria-pressed="true"] { background: var(--poireau); color: #fff; border-color: var(--poireau); }
@media print { .jour-journal { break-inside: avoid; } }

.compte-filtre { display: inline-block; min-width: 1.4em; padding: 0 5px; margin-left: 2px; border-radius: 99px; background: var(--papier); color: var(--encre-douce); font-size: .75rem; font-weight: 700; text-align: center; }
.chip[aria-pressed="true"] .compte-filtre { background: rgb(255 255 255 / .25); color: #fff; }
.chip[data-a="journal-humeur"][aria-pressed="true"], .chip[data-a="journal-suggestion"][aria-pressed="true"] { background: var(--poireau); color: #fff; border-color: var(--poireau); }
.titre-res { flex-basis: 100%; margin-top: 6px; display: flex; gap: 6px; align-items: center; }
.chip-petit { font-size: .82rem; padding: 4px 10px; }

/* ---------- j'ai ces aliments ---------- */
.jai-ca-ferme, .jai-ca { border-left: 5px solid var(--moutarde); }
.jai-ca .chip.choisi { background: var(--poireau); color: #fff; border-color: var(--poireau); }

.questions-jaica { padding: 12px; border-radius: 14px; background: var(--moutarde-pale); }
.questions-jaica ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.questions-jaica li { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }

.btn-suppr { padding-inline: 8px; }
.bandeau-suppr { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: 14px; background: var(--moutarde-pale); }



/* ---------- idées de saison ---------- */
.saison { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--trait); }

.btn.garde { color: var(--tomate); border-color: var(--tomate); }

:root[data-theme="dark"] .entete-saison { background: linear-gradient(135deg, #3a2a18, #33261a); color: #f3e3cc; }

/* ---------- promotions ---------- */

/* ---------- envoyer ---------- */
.fenetre-envoi { display: grid; gap: 14px; }

/* ---------- gamelles et restes ---------- */

.choix-gamelle { display: grid; gap: 2px; text-align: left; padding: 10px 12px; border: 1.5px solid var(--trait); border-radius: 12px; background: var(--surface); color: var(--encre); font: inherit; cursor: pointer; }
.choix-gamelle[aria-checked="true"] { border-color: var(--poireau); background: var(--poireau-pale); }
.chip.chip-petit { padding: 4px 9px; font-size: .78rem; min-height: 30px; }
.carte-quantites { padding: 12px 14px; border-radius: 14px; background: var(--moutarde-pale); }
.total-cuisson { display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; border-top: 1px dashed color-mix(in srgb, var(--encre) 25%, transparent); font-size: 1.05rem; }
.plus-restes { color: var(--poireau); font-weight: 700; }
.fenetre-gamelles { display: grid; gap: 14px; }
.aff-case .aff-tag { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: rgb(47 107 71 / .12); }

.affiche-voile { position: fixed; inset: 0; z-index: 60; overflow-y: auto; grid-template-columns: minmax(0, 1fr); background: color-mix(in srgb, var(--papier) 94%, transparent); backdrop-filter: blur(4px); padding: 16px; display: grid; gap: 14px; align-content: start; justify-items: center; }
.affiche-outils { width: 100%; max-width: 1123px; display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--trait); border-radius: var(--r); padding: 14px; box-shadow: var(--ombre); }
.affiche-cadre { width: 100%; max-width: 1123px; min-width: 0; }
.affiche-echelle { position: relative; overflow: hidden; }
.affiche { width: 1123px; height: 794px; transform-origin: top left; box-shadow: 0 10px 40px rgb(0 0 0 / .18); border-radius: 6px; overflow: hidden;
  display: flex; flex-direction: column; gap: 14px; padding: 30px 34px 24px; color-scheme: light; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-family: var(--f-texte); }
