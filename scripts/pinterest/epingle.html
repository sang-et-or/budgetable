<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Bri;src:url("file:///tmp/claude-0/-home-claude/e7ca5389-2d6a-596d-9613-ea14ab557a7b/scratchpad/fonts/gf/ofl/bricolagegrotesque/BricolageGrotesque[opsz,wdth,wght].ttf");font-weight:100 900}
@font-face{font-family:Cav;src:url("file:///tmp/claude-0/-home-claude/e7ca5389-2d6a-596d-9613-ea14ab557a7b/scratchpad/fonts/gf/ofl/caveat/Caveat[wght].ttf");font-weight:400 700}
@font-face{font-family:Fig;src:url("file:///tmp/claude-0/-home-claude/e7ca5389-2d6a-596d-9613-ea14ab557a7b/scratchpad/fonts/gf/ofl/figtree/Figtree[wght].ttf");font-weight:300 900}
*{box-sizing:border-box;margin:0}
body{width:1000px;height:1500px;background:#f6f4ec;font-family:Fig;color:#1d2721;overflow:hidden;position:relative}
.tag{position:absolute;top:70px;left:70px;background:#2f6b47;color:#fff;font:800 30px Fig;letter-spacing:.08em;padding:14px 26px;border-radius:999px;text-transform:uppercase}
h1{position:absolute;top:150px;left:70px;right:70px;font:800 92px/1.02 Bri;letter-spacing:-.02em;color:#1d2721}
h1.m{font-size:76px} h1.s{font-size:64px}
.assiette{position:absolute;left:50%;top:var(--y,640px);transform:translateX(-50%);width:700px;height:700px;border-radius:50%;background:#fff;box-shadow:0 30px 60px rgba(29,39,33,.16),inset 0 0 0 22px #eef1ea;display:grid;place-items:center}
.assiette svg{width:570px;height:570px} .emoji{font-size:330px;line-height:1}
.prix{position:absolute;right:70px;top:calc(var(--y,640px) - 40px);width:250px;height:250px;border-radius:50%;background:#e3b44a;color:#1d2721;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(9deg);box-shadow:0 14px 30px rgba(0,0,0,.18);border:8px solid #fff}
.prix b{font:800 74px/1 Bri;letter-spacing:-.03em} .prix span{font:700 30px Fig;margin-top:6px}
.prix i{font:600 24px Fig;font-style:normal;opacity:.75}
.infos{position:absolute;left:0;right:0;top:calc(var(--y,640px) + 740px);display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:0 60px}
.infos span{background:#fff;border:3px solid #dde3d8;border-radius:999px;padding:12px 26px;font:700 32px Fig;color:#25332b}
.note{position:absolute;left:0;right:0;top:calc(var(--y,640px) + 830px);text-align:center;font:700 54px Cav;color:#2f6b47}
.liste{position:absolute;left:70px;right:70px;top:var(--y,640px);display:flex;flex-direction:column;gap:22px}
.liste div{background:#fff;border-radius:28px;padding:26px 32px;display:flex;align-items:center;gap:26px;box-shadow:0 10px 24px rgba(29,39,33,.08)}
.liste em{font:800 26px Fig;font-style:normal;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:#2f6b47;border-radius:16px;padding:10px 14px;min-width:64px;text-align:center;flex:none}
.liste strong{font:700 38px/1.15 Fig;flex:1} .liste span{font:800 38px Bri;color:#b0412d;flex:none}
.liste.large{gap:34px;margin-top:40px} .liste.large div{padding:44px 36px;border-radius:34px} .liste.large strong{font-size:46px} .liste.large span{font-size:46px} .liste.large em{font-size:28px;padding:12px 16px}
.liste.serre{gap:14px} .liste.serre div{padding:18px 28px} .liste.serre strong{font-size:33px}
body.mode-liste .assiette,body.mode-liste .infos{display:none}
body.mode-liste .prix{top:70px;right:60px;width:210px;height:210px} body.mode-liste .prix b{font-size:60px}
body.mode-liste h1{right:290px}
body.mode-liste .note{top:auto;bottom:185px}
body.sans-prix .prix{display:none} body.sans-prix h1{right:70px}
.pied{position:absolute;left:0;right:0;bottom:0;height:150px;background:#2f6b47;color:#fff;display:flex;align-items:center;gap:26px;padding:0 70px}
.pied svg{width:84px;height:84px;flex:none} .pied b{font:800 44px Bri;display:block} .pied span{font:600 28px Fig;opacity:.92}
</style></head><body>
<div class="tag" id="tag"></div><h1 id="titre"></h1>
<div class="assiette" id="assiette"></div><div class="prix"><i>environ</i><b id="prix"></b><span>la part</span></div>
<div class="infos" id="infos"></div><div class="liste" id="liste"></div>
<div class="note" id="note">Fait maison, facile et pas cher ✓</div>
<div class="pied"><svg viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#fff"/><circle cx="228" cy="292" r="140" fill="none" stroke="#2f6b47" stroke-width="26"/><circle cx="372" cy="150" r="82" fill="#e3b44a" stroke="#fff" stroke-width="14"/><path d="M398 118a40 40 0 1 0 0 64M336 140h48M336 162h48" fill="none" stroke="#2f6b47" stroke-width="14" stroke-linecap="round"/></svg>
<div><b>budgetable.fr</b><span>La recette + vos menus et la liste de courses</span></div></div>
<script src="http://localhost:8766/js/data.js"></script>
<script src="http://localhost:8766/js/modeles.js"></script>
<script src="http://localhost:8766/js/engine.js"></script>
<script src="http://localhost:8766/js/catalogue.js"></script>
<script src="http://localhost:8766/js/gourmand.js"></script>
<script src="http://localhost:8766/js/entrees.js"></script>
<script src="http://localhost:8766/js/petitdej.js"></script>
<script src="http://localhost:8766/js/saison.js"></script>
<script src="http://localhost:8766/js/airfryer.js"></script>
<script src="http://localhost:8766/js/visuels.js"></script>
<script>
window.dessiner = (p) => {
  document.body.className = p.lignes ? 'mode-liste' + (p.prix ? '' : ' sans-prix') : '';
  if (p.lignes) {
    document.getElementById('tag').textContent = p.tag;
    const t = document.getElementById('titre'); t.textContent = p.nom; t.className = p.nom.length > 30 ? 'm' : '';
    document.getElementById('prix').textContent = p.prix + ' €'; document.querySelector('.prix span').textContent = p.unite || 'la part';
    document.querySelector('.prix i').textContent = p.unite === 'max' ? 'moins de' : 'environ';
    const l = document.getElementById('liste'); l.className = 'liste' + (p.lignes.length > 5 ? ' serre' : p.lignes.length <= 3 ? ' large' : '');
    l.innerHTML = p.lignes.map(([a, b, c]) => '<div>' + (a ? '<em>' + a + '</em>' : '') + '<strong>' + b + '</strong>' + (c ? '<span>' + c + '</span>' : '') + '</div>').join('');
    document.getElementById('note').textContent = p.note || '';
    document.body.style.setProperty('--y', Math.max(340, t.offsetTop + t.offsetHeight + 60) + 'px');
    return true;
  }
  document.getElementById('liste').innerHTML = '';
  document.getElementById('note').textContent = 'Fait maison, facile et pas cher ✓';
  document.querySelector('.prix span').textContent = 'la part'; document.querySelector('.prix i').textContent = 'environ';
  const E = window.Engine;
  const EXTRA = {}; for (const m of ['Saison', 'Entrees', 'Gourmand', 'PetitDej', 'CatalogueExtra']) for (const i of ((window[m] || {}).INGREDIENTS || [])) if (i && i.id) EXTRA[i.id] = i;
  const tout = [].concat(MENU_DATA.recettes, (window.Saison||{}).RECETTES||[], (window.Entrees||{}).RECETTES||[], (window.Gourmand||{}).RECETTES||[], (window.PetitDej||{}).RECETTES||[], (window.AirFryer||{}).RECETTES||[]);
  const rec = tout.find((r) => r.nom === p.nom);
  document.getElementById('tag').textContent = p.tag;
  const t = document.getElementById('titre'); t.textContent = p.nom; t.className = p.nom.length > 40 ? 's' : p.nom.length > 24 ? 'm' : '';
  document.getElementById('prix').textContent = p.prix + ' €';
  const a = document.getElementById('assiette');
  a.innerHTML = !rec ? '<span class="emoji">🍽️</span>' : (rec.gourmand || rec.emoji) && rec.emoji ? '<span class="emoji">' + rec.emoji + '</span>' : Visuels.illustration(rec, { ...E, ING: new Proxy(E.ING, { get: (t, k) => t[k] || EXTRA[k] || { groupe: '?' } }) }, 570);
  if (p.note) document.getElementById('note').textContent = p.note;
  document.getElementById('infos').innerHTML = p.infos.map((x) => '<span>' + x + '</span>').join('');
  // la hauteur du titre décide où commence l'assiette
  const y = Math.max(380, t.offsetTop + t.offsetHeight + 60); document.body.style.setProperty('--y', y + 'px');
  return !!rec;
};
</script></body></html>
