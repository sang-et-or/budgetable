<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Budgétable</title>
<style>
  :root { --papier: #f6f4ec; --encre: #1d2721; --doux: #5b685f; --poireau: #2f6b47; --pale: #e3eee5; --moutarde: #f6d36b; --tomate: #b0412d; --trait: #dde3d8; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 380px; background: var(--papier); color: var(--encre); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  .store { height: 16px; background: repeating-linear-gradient(90deg, var(--poireau) 0 18px, #fbfaf3 18px 36px); }
  header { background: var(--poireau); color: #fff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: baseline; }
  header b { font-size: 17px; }
  main { padding: 12px 14px 16px; display: grid; gap: 14px; }
  h2 { font-size: 15px; margin: 0; }
  section { display: grid; gap: 8px; }
  textarea { width: 100%; min-height: 70px; border: 1px solid var(--trait); border-radius: 10px; padding: 8px; font: 12px ui-monospace, monospace; background: #fff; }
  button { font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid #c9d2c4; background: #fff; padding: 7px 14px; }
  .plein { background: var(--poireau); color: #fff; border-color: var(--poireau); font-weight: 600; }
  .petit { font-size: 12px; color: var(--doux); }
  .msg { font-size: 13px; }
  .msg.err { color: var(--tomate); }
  .carte { background: #fff; border: 1px solid var(--trait); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
  .total { display: flex; justify-content: space-between; font-weight: 700; font-variant-numeric: tabular-nums; }
  .eco { background: var(--pale); border-radius: 12px; padding: 10px 12px; }
  .eco strong { color: var(--poireau); font-size: 18px; }
  ul { margin: 0; padding-left: 16px; font-size: 12px; }
  .drives { display: flex; flex-wrap: wrap; gap: 6px; }
  .drives a { font-size: 12px; color: var(--poireau); }
</style>
</head>
<body>
<div class="store"></div>
<header><b>Budgétable</b><span class="petit" style="color:#e3eee5">courses en drive</span></header>
<main>
  <section>
    <h2>1. Ma liste</h2>
    <p class="petit" id="etat-liste">Aucune liste.</p>
    <label class="petit" for="colle">Dans Budgétable, onglet Courses : « Envoyer vers l’extension », puis collez ici.</label>
    <textarea id="colle" placeholder="BUDGETABLE1:{…}"></textarea>
    <div><button class="plein" id="enregistrer">Enregistrer la liste</button></div>
    <p class="msg" id="msg" role="status"></p>
  </section>
  <section>
    <h2>2. Mes drives</h2>
    <p class="petit">Ouvrez un drive, connectez-vous à votre compte : le panneau Budgétable apparaît en bas à droite.</p>
    <div class="drives" id="drives"></div>
  </section>
  <section>
    <h2>3. Mes paniers les moins chers</h2>
    <div id="comparaison" class="petit">Relevez des prix dans au moins un drive pour voir la répartition.</div>
    <div><button id="effacer">Effacer les prix relevés</button></div>
  </section>
</main>
<script src="drives.js"></script>
<script src="stockage.js"></script>
<script src="comparaison.js"></script>
<script src="popup.js"></script>
</body>
</html>
